[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sk-rag-tool"
version = "0.2.0"
description = "Standalone dense indexing and retrieval for multimodal JSONL corpora"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6", "Pillow>=9", "torch>=2.0", "transformers>=4.40"]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7.4"]
sentence-transformers = ["sentence-transformers>=3.0"]
parquet = ["pandas>=2.0", "pyarrow>=12"]

[project.scripts]
rag-tool = "rag_tool.cli:main"
